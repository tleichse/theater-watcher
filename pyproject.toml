[project]
name = "theater-watcher"
version = "0.1.0"
description = "Weekly email digest of casting opportunities in Portugal."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.1",
    "feedparser>=6.0.14",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "jinja2>=3.1.6",
    "premailer>=3.10.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.uv]
package = false
